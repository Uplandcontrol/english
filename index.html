<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg: #F6F4EF;
  --surface: #FFFFFF;
  --surface-alt: #EFEBE2;
  --ink: #1C1B17;
  --ink-soft: #5C584D;
  --muted: #9C978A;
  --line: rgba(28,27,23,0.08);
  --line-strong: rgba(28,27,23,0.14);

  --coral: #FF6B4A;
  --coral-deep: #E5502F;
  --coral-bg: #FFE8E0;
  --teal: #10A28F;
  --teal-deep: #0B7A6B;
  --teal-bg: #DCF3EE;
  --blue: #3E7BFA;
  --blue-bg: #E4ECFF;
  --purple: #8B5CF6;
  --purple-bg: #EFE7FE;
  --orange: #FF9F40;
  --orange-bg: #FFEEDA;
  --green: #22B573;
  --green-bg: #DEF5E9;
  --pink: #FF4D6D;
  --pink-bg: #FFE3E8;

  --shadow-sm: 0 1px 2px rgba(28,27,23,0.04), 0 6px 16px rgba(28,27,23,0.05);
  --shadow-md: 0 4px 10px rgba(28,27,23,0.06), 0 16px 32px -8px rgba(28,27,23,0.12);
  --radius-card: 20px;
  --radius-ctl: 14px;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding:0 0 100px 0;
}

.wrap{max-width:680px;margin:0 auto;padding:48px 20px;}

/* ---------- HERO ---------- */
.hero{text-align:center;margin-bottom:40px;}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;letter-spacing:0.2px;
  color:var(--teal-deep);background:var(--teal-bg);
  padding:6px 14px;border-radius:999px;margin-bottom:18px;
}
.hero h1{
  font-size:clamp(26px,5.6vw,34px);font-weight:800;line-height:1.35;
  margin:0 0 12px 0;color:var(--ink);letter-spacing:-0.02em;
}
.hero p{
  font-size:15px;font-weight:500;color:var(--ink-soft);max-width:440px;margin:0 auto;line-height:1.7;
}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--surface-alt);padding:5px;border-radius:16px;}
.tab-btn{
  flex:1;font-size:13.5px;font-weight:700;letter-spacing:-0.01em;
  background:transparent;border:none;color:var(--ink-soft);
  padding:11px 12px;cursor:pointer;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s ease, color .15s ease;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--surface);background:var(--ink);}
.due-badge{
  background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;
  border-radius:999px;padding:1.5px 7px;min-width:14px;text-align:center;
}
.tab-btn.active .due-badge{background:var(--coral);}
.due-badge:empty{display:none;}

/* ---------- MODE SWITCH ---------- */
.mode-switch{display:flex;gap:8px;margin-bottom:20px;}
.mode-btn{
  flex:1;font-size:12.5px;font-weight:700;letter-spacing:-0.01em;
  background:var(--surface);border:1.5px solid var(--line);color:var(--ink-soft);
  border-radius:14px;padding:13px 10px;cursor:pointer;text-align:center;line-height:1.4;
  transition:all .15s ease;
}
.mode-btn.active{border-color:transparent;background:var(--teal);color:#fff;box-shadow:var(--shadow-sm);}
.mode-btn[data-mode="ko2en"].active{background:var(--coral);}

/* ---------- PANELS / FORM ---------- */
.postcard-form{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  padding:22px 22px 20px 22px;
  margin-bottom:16px;
  box-shadow:var(--shadow-sm);
}
.airmail-border{display:none;}
.form-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}
.form-label{
  font-size:12px;color:var(--muted);font-weight:700;
  letter-spacing:-0.01em;margin-bottom:8px;display:block;
}
#phrase-input{
  flex:1;min-width:220px;
  font-family:inherit;font-size:16px;font-weight:500;
  background:var(--bg);border:1.5px solid transparent;border-radius:var(--radius-ctl);
  padding:13px 16px;color:var(--ink);outline:none;transition:border-color .15s ease, background .15s ease;
}
#phrase-input::placeholder{color:var(--muted);font-weight:400;}
#phrase-input:focus{border-color:var(--teal);background:var(--surface);}
#context-select{
  font-family:inherit;font-size:13px;font-weight:600;
  background:var(--bg);border:1.5px solid transparent;border-radius:var(--radius-ctl);
  padding:13px 14px;color:var(--ink-soft);cursor:pointer;
}
#context-select:focus{border-color:var(--teal);outline:none;}
.send-btn{
  margin-top:16px;width:100%;justify-content:center;
  font-family:inherit;font-size:15px;font-weight:700;
  background:var(--coral);color:#fff;border:none;border-radius:999px;
  padding:15px 24px;cursor:pointer;display:flex;align-items:center;gap:8px;
  transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
  box-shadow:var(--shadow-sm);
}
.send-btn:hover{background:var(--coral-deep);transform:translateY(-1px);box-shadow:var(--shadow-md);}
.send-btn:active{transform:scale(0.98) translateY(0);}
.send-btn:disabled{opacity:0.5;cursor:default;transform:none;}
.plane{display:none;}
.send-btn.sending{animation:pulse-btn 1s ease-in-out infinite;}
@keyframes pulse-btn{
  0%, 100%{opacity:1;}
  50%{opacity:0.75;}
}

.err-msg{
  margin-top:12px;font-size:13px;font-weight:600;color:var(--coral-deep);
  line-height:1.6;
}

/* ---------- TOPBAR ---------- */
.topbar{display:flex;justify-content:flex-end;gap:10px;margin-bottom:12px;}

/* ---------- RESULT STACK ---------- */
#stack{display:flex;flex-direction:column;gap:14px;}
.card-empty{
  text-align:center;color:var(--muted);font-size:14px;font-weight:500;
  padding:50px 20px;line-height:1.8;
}

.card{
  position:relative;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-card);
  padding:20px 22px 18px 22px;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .15s ease, transform .15s ease;
}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.card::before{display:none;}

.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:8px;}

.stats-bar{
  display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;
}
.stat-chip{
  font-size:12px;font-weight:600;color:var(--ink-soft);
  background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;
}
.stat-chip b{color:var(--ink);font-weight:800;}

.search-row{margin-bottom:14px;}
#search-input{
  width:100%;font-family:inherit;font-size:14px;font-weight:500;
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-ctl);
  padding:11px 15px;color:var(--ink);outline:none;transition:border-color .15s ease;
}
#search-input::placeholder{color:var(--muted);font-weight:400;}
#search-input:focus{border-color:var(--teal);}

.group-header{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;padding:12px 4px;margin-top:8px;
  border-bottom:1px solid var(--line);
}
.group-header:first-child{margin-top:0;}
.group-header-label{font-size:14px;font-weight:800;color:var(--ink);}
.group-header-meta{display:flex;align-items:center;gap:8px;}
.group-header-count{font-size:12px;font-weight:600;color:var(--muted);}
.group-chevron{font-size:12px;color:var(--muted);transition:transform .15s ease;}
.group-chevron.open{transform:rotate(180deg);}
.group-items{padding-top:4px;display:flex;flex-direction:column;gap:14px;}

.date-header{
  font-size:12.5px;font-weight:700;color:var(--muted);
  margin:22px 2px 10px 2px;
}
.date-header:first-child{margin-top:4px;}

.entry-header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  cursor:pointer;
}
.entry-header-left{min-width:0;flex:1;}
.entry-header-left .mode-tag{margin-bottom:8px;}
.entry-header-left .phrase-line{display:block;}
.entry-header-right{
  flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px;
}
.expand-btn{
  font-size:11px;font-weight:700;color:var(--teal-deep);
  background:transparent;border:none;cursor:pointer;padding:2px 0;
  white-space:nowrap;
}
.entry-body{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.mode-tag{
  font-size:11px;font-weight:700;
  border-radius:999px;padding:4px 11px;
  display:inline-block;margin-bottom:10px;
  background:var(--teal-bg);color:var(--teal-deep);
}
.mode-tag.tag-coral{background:var(--coral-bg);color:var(--coral-deep);}
.phrase-line{
  font-size:19px;font-weight:800;color:var(--ink);
  letter-spacing:-0.01em;line-height:1.4;
}
.stamp{
  flex-shrink:0;font-size:11px;font-weight:700;
  border-radius:999px;padding:6px 12px;
  background:var(--blue-bg);color:var(--blue);
  white-space:nowrap;
}
.stamp.chip-blue{background:var(--blue-bg);color:#2456C9;}
.stamp.chip-purple{background:var(--purple-bg);color:#6B3FD6;}
.stamp.chip-orange{background:var(--orange-bg);color:#C97219;}
.stamp.chip-green{background:var(--green-bg);color:#188A56;}

.ipa{
  font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal-deep);
  margin:2px 0 12px 0;font-weight:500;
}

.explain{
  font-size:13.5px;font-weight:500;color:var(--ink-soft);line-height:1.75;margin-bottom:16px;
  background:var(--bg);padding:12px 14px;border-radius:12px;
}

.example{
  display:flex;gap:12px;align-items:flex-start;
  padding:11px 0;border-top:1px solid var(--line);
}

  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, getDoc, getDocs, query, orderBy

    loadUserDoc: async (uid) => {

      return snap.exists() ? snap.data() : null;
    },
    saveUserDoc: (uid, data) => setDoc(doc(db, 'users', uid), data, { merge: true })
  };
  window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
let history = [];
let voices = [];
let currentUtterance = null;
let currentBtn = null;
let apiKey = '';
let currentMode = 'en2ex';
let expandedIds = new Set();
let groupExpanded = new Set(['today', 'yesterday']);

const CONTEXT_COLOR = {
  '일상 대화': 'chip-blue',
  '비즈니스/이메일': 'chip-purple',
  '시험/작문': 'chip-orange',

function contextChipClass(context){

const MODE_CONFIG = {
  en2ex: {
    label: '표현 입력 (어려운 영어 구문)',
    placeholder: '예: used to / I wish I had known / on the other hand',

  },
  ko2en: {

    placeholder: '예: 나 완전 뻘쭘했잖아 / 오늘따라 유독 피곤하네 / 그건 좀 아닌 것 같은데',

};

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {

function loadApiKey(){
  try{
    apiKey = sanitizeKey(localStorage.getItem('word_post_office_gemini_key') || '');
  }catch(e){ apiKey = ''; }
  const status = document.getElementById('key-status');
  const input = document.getElementById('api-key-input');
  if(apiKey){
    input.value = apiKey;
    status.textContent = '키가 저장되어 있습니다.';
  }else{
    status.textContent = '키를 입력하고 저장 버튼을 눌러주세요.';
  }
  updateKeyPanelVisibility();
}

function updateKeyPanelVisibility(forceOpen){
  const panel = document.getElementById('key-panel');
  const summary = document.getElementById('key-panel-summary');
  if(apiKey && !forceOpen){
    panel.style.display = 'none';
    summary.style.display = 'flex';
  }else{
    panel.style.display = 'block';
    summary.style.display = 'none';
  }
}

document.getElementById('key-change-btn').addEventListener('click', () => {
  updateKeyPanelVisibility(true);
});

function sanitizeKey(k){
  return (k || '').replace(/[^\x20-\x7E]/g, '').trim();
}

document.getElementById('save-key-btn').addEventListener('click', () => {
  const input = document.getElementById('api-key-input');
  const val = sanitizeKey(input.value);
  if(!val){
    document.getElementById('key-status').textContent = '키를 입력해주세요.';
    return;
  }
  apiKey = val;
  input.value = val;
  try{ localStorage.setItem('word_post_office_gemini_key', val); }catch(e){}
  cloudSaveKey(val);
  document.getElementById('key-status').textContent = '키가 저장되었습니다.';
  updateKeyPanelVisibility();
});

function loadVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(){
  const preferred = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang && v.lang.startsWith('en'));
  return preferred || null;
}

function speak(text, btn){
  if(!('speechSynthesis' in window)){
    alert('이 브라우저는 음성 합성을 지원하지 않습니다.');
    return;
  }
  window.speechSynthesis.cancel();
  if(currentBtn) currentBtn.classList.remove('playing');
  if(currentBtn === btn){
    currentBtn = null;
    currentUtterance = null;
    return;
  }
  const utter = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if(v) utter.voice = v;
  utter.lang = 'en-US';
  utter.rate = 0.92;
  utter.onend = () => { btn.classList.remove('playing'); currentBtn = null; };
  utter.onerror = () => { btn.classList.remove('playing'); currentBtn = null; };
  btn.classList.add('playing');
  currentBtn = btn;
  currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}

function loadHistory(){
  try{
    const raw = localStorage.getItem('word_post_office_postcards');
    if(raw){
      history = JSON.parse(raw);
      renderStack();
    }
  }catch(e){
    /* 저장된 기록 없음 */
  }
}

function saveHistory(){
  try{
    localStorage.setItem('word_post_office_postcards', JSON.stringify(history));
  }catch(e){
    console.error('저장 실패', e);
  }
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderGlossedSentence(ex){
  const en = ex.en || '';
  const words = Array.isArray(ex.words) ? ex.words : null;
  if(!words || words.length === 0){
    return escapeHtml(en);
  }
  return words.map(w => {
    const text = escapeHtml(w.w || '');
    const meaning = (w.m || '').trim();
    if(!text.trim() || !meaning){
      return text;
    }
    return `<span class="gloss-word" data-meaning="${escapeHtml(meaning)}">${text}</span>`;
  }).join(' ');
}

let tooltipEl = null;
let activeWordEl = null;

function ensureTooltip(){
  if(!tooltipEl){
    tooltipEl = document.createElement('div');
    tooltipEl.className = 'word-tooltip';
    document.body.appendChild(tooltipEl);
  }
  return tooltipEl;
}

function hideTooltip(){
  if(tooltipEl) tooltipEl.classList.remove('visible');
  if(activeWordEl) activeWordEl.classList.remove('active');
  activeWordEl = null;
}

function showTooltipFor(wordEl){
  const tip = ensureTooltip();
  tip.textContent = wordEl.dataset.meaning;
  tip.classList.add('visible');

  const rect = wordEl.getBoundingClientRect();
  const tipRect = tip.getBoundingClientRect();
  let left = rect.left + rect.width / 2 - tipRect.width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));
  let top = rect.top - tipRect.height - 10;
  if(top < 8) top = rect.bottom + 10;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';

  wordEl.classList.add('active');
  activeWordEl = wordEl;
}

document.addEventListener('click', (e) => {
  const wordEl = e.target.closest('.gloss-word');
  if(wordEl){
    e.stopPropagation();
    if(activeWordEl === wordEl){
      hideTooltip();
    }else{
      hideTooltip();
      showTooltipFor(wordEl);
    }
  }else if(!e.target.closest('.word-tooltip')){
    hideTooltip();
  }
});
window.addEventListener('scroll', hideTooltip, true);

function keyFor(item, idx){
  return item.id || ('idx-' + idx);
}

function formatDateLabel(dateStr){
  if(!dateStr) return '날짜 미상';
  if(dateStr === todayStr()) return '오늘';
  if(dateStr === addDaysStr(-1)) return '어제';
  const parts = dateStr.split('-');
  if(parts.length !== 3) return dateStr;
  const [y, m, d] = parts;
  return `${y}년 ${parseInt(m, 10)}월 ${parseInt(d, 10)}일`;
}

function formatMonthLabel(monthKey){
  const parts = monthKey.split('-');
  if(parts.length !== 2) return monthKey;
  const [y, m] = parts;
  return `${y}년 ${parseInt(m, 10)}월`;
}

function groupKeyFor(dateStr){
  if(!dateStr || dateStr === '날짜 미상') return 'unknown';
  if(dateStr === todayStr()) return 'today';
  if(dateStr === addDaysStr(-1)) return 'yesterday';
  return dateStr.slice(0, 7);
}

function groupLabelFor(key, dateStr){
  if(key === 'today') return '오늘';
  if(key === 'yesterday') return '어제';
  if(key === 'unknown') return '날짜 미상';
  return formatMonthLabel(key);
}

function itemMatchesSearch(item, term){
  if(!term) return true;
  const t = term.toLowerCase();
  if((item.phrase || '').toLowerCase().includes(t)) return true;
  return (item.examples || []).some(ex =>
    (ex.en || '').toLowerCase().includes(t) || (ex.ko || '').toLowerCase().includes(t)
  );
}

function renderStatsBar(){
  const bar = document.getElementById('stats-bar');
  if(history.length === 0){
    bar.style.display = 'none';
    bar.innerHTML = '';

  const thisMonth = todayStr().slice(0, 7);
  const monthCount = history.filter(item => (item.createdAt || '').startsWith(thisMonth)).length;
  const reviewingCount = history.filter(item => item.reviewEnabled !== false).length;
  const masteredCount = history.filter(item => (item.box || 0) >= 4).length;

  bar.innerHTML = `
    <div class="stat-chip">전체 <b>${history.length}</b>개</div>
    <div class="stat-chip">이번 달 <b>${monthCount}</b>개</div>
    <div class="stat-chip">복습 중 <b>${reviewingCount}</b>개</div>
    <div class="stat-chip">마스터 <b>${masteredCount}</b>개</div>
  `;
}

function renderStack(){
  const stack = document.getElementById('stack');
  const emptyMsg = document.getElementById('empty-msg');
  const topbar = document.getElementById('topbar');
  const searchRow = document.getElementById('search-row');

  stack.innerHTML = '';
  renderStatsBar();

  if(history.length === 0){
    emptyMsg.style.display = 'block';
    stack.appendChild(emptyMsg);
    topbar.style.display = 'none';
    searchRow.style.display = 'none';
    return;
  }
  emptyMsg.style.display = 'none';
  topbar.style.display = 'flex';
  searchRow.style.display = 'block';

  const term = (document.getElementById('search-input').value || '').trim();

  const entries = history.slice().reverse().map((item, revIdx) => ({
    item, idx: history.length - 1 - revIdx
  })).filter(({ item }) => itemMatchesSearch(item, term));

  if(entries.length === 0){
    const noResult = document.createElement('div');
    noResult.className = 'card-empty';
    noResult.textContent = '검색 결과가 없습니다.';
    stack.appendChild(noResult);
    return;
  }

  if(term){
    const header = document.createElement('div');
    header.className = 'date-header';
    header.textContent = `검색 결과 ${entries.length}개`;
    stack.appendChild(header);
    entries.forEach(({ item, idx }) => stack.appendChild(renderEntryCard(item, idx)));
  }else{
    const groups = [];
    const groupMap = new Map();
    entries.forEach(entry => {
      const d = entry.item.createdAt || '날짜 미상';
      const gKey = groupKeyFor(d);
      if(!groupMap.has(gKey)){
        const g = { key: gKey, label: groupLabelFor(gKey, d), entries: [] };
        groupMap.set(gKey, g);
        groups.push(g);
      }
      groupMap.get(gKey).entries.push(entry);
    });

    groups.forEach(group => {
      const isOpen = groupExpanded.has(group.key);

      const header = document.createElement('div');
      header.className = 'group-header';
      header.dataset.group = group.key;
      header.innerHTML = `
        <span class="group-header-label">${group.label}</span>
        <span class="group-header-meta">
          <span class="group-header-count">${group.entries.length}개</span>
          <span class="group-chevron ${isOpen ? 'open' : ''}">▾</span>
        </span>
      `;
      stack.appendChild(header);

      if(isOpen){
        const itemsWrap = document.createElement('div');
        itemsWrap.className = 'group-items';
        group.entries.forEach(({ item, idx }) => itemsWrap.appendChild(renderEntryCard(item, idx)));
        stack.appendChild(itemsWrap);
      }
    });
  }

  stack.querySelectorAll('[data-group]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.group;
      if(groupExpanded.has(key)) groupExpanded.delete(key);
      else groupExpanded.add(key);
      renderStack();
    });
  });

  stack.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if(e.target.closest('.stamp')) return;
      const key = el.dataset.toggle;
      if(expandedIds.has(key)) expandedIds.delete(key);
      else expandedIds.add(key);
      renderStack();
    });
  });

  stack.querySelectorAll('[data-toggle-review]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = +btn.dataset.toggleReview;
      const item = history[i];
      item.reviewEnabled = item.reviewEnabled === false ? true : false;
      if(item.reviewEnabled){
        item.nextReview = todayStr();
      }
      saveHistory();
      cloudUpdateEntry(item.id, { reviewEnabled: item.reviewEnabled, nextReview: item.nextReview });
      updateDueBadge();
      renderStack();
    });
  });

  stack.querySelectorAll('.play-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = +btn.dataset.idx, ex = +btn.dataset.ex;
      const text = history[i].examples[ex].en;
      speak(text, btn);
    });
  });
  stack.querySelectorAll('[data-phrase-play]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = +btn.dataset.phrasePlay;
      speak(history[i].phrase, btn);
    });
  });
  stack.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = +btn.dataset.remove;
      const removedId = history[i].id;
      history.splice(i, 1);
      saveHistory();
      if(removedId) cloudDeleteEntry(removedId);
      updateDueBadge();
      renderStack();
    });
  });
}
async function generate(phrase, context, mode){
  let system;
  let userContent;

  if(mode === 'ko2en'){
    system = `너는 한국인이 일상에서 쓰는 한국어 표현을 자연스러운 영어 표현으로 바꿔주는 도우미다. 반드시 아래 JSON 형식으로만 답하라. 다른 설명, 코드블록 표시(백틱), 서두 문구를 절대 포함하지 마라.

{
  "ipa": "가장 추천하는 영어 표현의 IPA 발음 표기 (미국식)",
  "explanation": "이 한국어 표현을 영어로 옮길 때 뉘앙스나 주의할 점, 직역하면 안 되는 이유 등을 한국어로 2~3문장 설명",
  "examples": [
    {
      "en": "영어 표현/문장 1",
      "ko": "이 표현이 어울리는 상황이나 뉘앙스 설명",
      "words": [
        {"w": "en의 첫 단어(구두점 포함 원문 그대로)", "m": "그 단어의 간단한 한국어 뜻"},
        {"w": "en의 두 번째 단어", "m": "간단한 한국어 뜻"}
      ]
    }
  ]
}

"${context}" 상황에 맞게, 격식체와 캐주얼한 표현을 골고루 섞어서 실제로 원어민이 쓸 법한 자연스러운 영어 표현 4개를 작성하라. 절대 직역하지 말고 의미와 뉘앙스를 살려서 옮겨라.

각 example의 "words" 배열은 반드시 "en" 문장을 공백(스페이스) 기준으로 나눈 토큰과 순서·개수가 정확히 일치해야 한다. 즉 words의 "w" 값들을 공백으로 이어붙이면 "en"과 완전히 같아야 한다. 마침표/쉼표/물음표 같은 구두점은 별도 토큰으로 만들지 말고 바로 앞 단어에 붙여라 (예: "know?"). 관사(a, the), 전치사 등 문법적으로만 쓰이는 단어도 짧게 역할이나 뜻을 적어라 (예: "the": "그 (특정한 것을 가리킴)").`;
    userContent = `한국어 표현: ${phrase}`;
  }else{
    system = `너는 한국인 영어 학습자를 돕는 예문 생성기다. 반드시 아래 JSON 형식으로만 답하라. 다른 설명, 코드블록 표시(백틱), 서두 문구를 절대 포함하지 마라.

{
  "ipa": "표현의 IPA 발음 표기 (미국식)",
  "explanation": "이 표현이 왜 어렵거나 헷갈리는지, 핵심 뉘앙스를 한국어로 2~3문장 설명",
  "examples": [
    {
      "en": "영어 예문 1",
      "ko": "자연스러운 한국어 번역",
      "words": [
        {"w": "en의 첫 단어(구두점 포함 원문 그대로)", "m": "그 단어의 간단한 한국어 뜻"},
        {"w": "en의 두 번째 단어", "m": "간단한 한국어 뜻"}
      ]
    }
  ]
}

예문은 "${context}" 상황에 맞게 자연스럽고 실제로 쓸 법한 문장으로 4개 작성하라. 난이도는 중급 학습자 기준으로.

각 example의 "words" 배열은 반드시 "en" 문장을 공백(스페이스) 기준으로 나눈 토큰과 순서·개수가 정확히 일치해야 한다. 즉 words의 "w" 값들을 공백으로 이어붙이면 "en"과 완전히 같아야 한다. 마침표/쉼표/물음표 같은 구두점은 별도 토큰으로 만들지 말고 바로 앞 단어에 붙여라 (예: "know?"). 관사(a, the), 전치사 등 문법적으로만 쓰이는 단어도 짧게 역할이나 뜻을 적어라 (예: "the": "그 (특정한 것을 가리킴)").`;
    userContent = `표현: ${phrase}`;
  }

  if(!apiKey){
    throw new Error('API 키를 먼저 입력하고 저장해주세요.');
  }

  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";

  const response = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": apiKey
    },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: system }] },
      contents: [
        { role: "user", parts: [{ text: userContent }] }
      ],
      generationConfig: {
        responseMimeType: "application/json"
      }
    })
  });

  if(!response.ok){
    let detail = '';
    try{
      const errBody = await response.json();
      detail = (errBody && errBody.error && errBody.error.message) ? errBody.error.message : '';
    }catch(e){ /* 본문을 읽지 못함 */ }
    if(response.status === 400 && /API key not valid/i.test(detail)){
      throw new Error('API 키가 올바르지 않습니다. 키를 다시 확인해주세요.');
    }
    throw new Error('API 요청 실패 (' + response.status + ')' + (detail ? ': ' + detail : ''));
  }

  const data = await response.json();
  const candidate = (data.candidates || [])[0];
  const textPart = candidate && candidate.content && candidate.content.parts
    ? candidate.content.parts.find(p => typeof p.text === 'string')
    : null;
  if(!textPart) throw new Error('응답에 텍스트가 없습니다.');

  let clean = textPart.text.trim();
  clean = clean.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '');

  let parsed;
  try{
    parsed = JSON.parse(clean);
  }catch(e){
    throw new Error('응답 형식을 해석하지 못했습니다.');
  }
  return parsed;
}

/* ---------- 복습 (Leitner 방식) ---------- */
const REVIEW_INTERVALS = [1, 2, 4, 9, 20];

function todayStr(){
  return new Date().toISOString().slice(0, 10);
}

function addDaysStr(days){
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function getDueItems(){
  const today = todayStr();
  return history
    .map((item, idx) => ({ item, idx }))
    .filter(({ item }) => item.reviewEnabled !== false && (item.nextReview || todayStr()) <= today);
}

function updateDueBadge(){
  const badge = document.getElementById('due-badge');
  const n = getDueItems().length;
  badge.textContent = n > 0 ? String(n) : '';
}

let reviewQueue = [];
let reviewPos = 0;
let reviewRevealed = false;

function renderReview(){
  reviewQueue = getDueItems();
  reviewPos = 0;
  reviewRevealed = false;
  renderReviewCard();
}

function scoreCurrent(know){
  const { idx } = reviewQueue[reviewPos];
  const item = history[idx];
  item.box = know ? Math.min((item.box || 0) + 1, REVIEW_INTERVALS.length - 1) : 0;
  item.nextReview = addDaysStr(REVIEW_INTERVALS[item.box]);
  item.lastReviewed = todayStr();
  saveHistory();
  cloudUpdateEntry(item.id, { box: item.box, nextReview: item.nextReview, lastReviewed: item.lastReviewed });
  updateDueBadge();
  reviewPos += 1;
  reviewRevealed = false;
  renderReviewCard();
}

    bodyHtml = `

      </div>
    `;
  }

  const pct = Math.round((reviewPos / reviewQueue.length) * 100);
  area.innerHTML = `
    <div class="review-progress"><span>${reviewPos + 1} / ${reviewQueue.length}</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>

      ${bodyHtml}
    </div>
  `;

  document.getElementById('review-play-phrase').addEventListener('click', (e) => {
    speak(item.phrase, e.currentTarget);
  });

  const revealBtn = document.getElementById('reveal-btn');
  if(revealBtn){
    revealBtn.addEventListener('click', () => {
      reviewRevealed = true;
      renderReviewCard();
    });
  }

  const againBtn = document.getElementById('score-again');
  if(againBtn) againBtn.addEventListener('click', () => scoreCurrent(false));
  const goodBtn = document.getElementById('score-good');
  if(goodBtn) goodBtn.addEventListener('click', () => scoreCurrent(true));

  area.querySelectorAll('[data-rex]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ex = item.examples[+btn.dataset.rex];
      speak(ex.en, btn);
    });
  });
}

/* ---------- Firebase Auth / Cloud Sync ---------- */
let currentUser = null;

function initAuthFlow(){
  if(window.fb){
    bindAuthUI();
  }else{
    window.addEventListener('fb-ready', bindAuthUI, { once: true });
  }
}

function bindAuthUI(){
  const btn = document.getElementById('google-signin-btn');
  const label = document.getElementById('signin-label');
  btn.disabled = false;
  label.textContent = 'Google로 계속하기';

  btn.addEventListener('click', async () => {
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    btn.disabled = true;
    label.textContent = '로그인하는 중...';
    try{
      await window.fb.signIn();
    }catch(err){
      errEl.textContent = '로그인에 실패했습니다: ' + err.message;
      errEl.style.display = 'block';
    }finally{
      btn.disabled = false;
      label.textContent = 'Google로 계속하기';
    }
  });

  window.fb.onAuthStateChanged(handleAuthChange);
}

async function handleAuthChange(user){
  const loginScreen = document.getElementById('login-screen');
  const appContent = document.getElementById('app-content');

  if(!user){
    currentUser = null;
    loginScreen.style.display = 'flex';
    appContent.style.display = 'none';
    return;
  }

  currentUser = user;
  loginScreen.style.display = 'none';
  appContent.style.display = 'block';
  renderAccountBar(user);

  await migrateLocalIfNeeded();
  await loadFromCloud();
  renderStack();
  updateDueBadge();
}

function renderAccountBar(user){
  const bar = document.getElementById('account-bar');
  const initial = (user.displayName || user.email || '?').trim().charAt(0).toUpperCase();
  const avatarHtml = user.photoURL
    ? `<img src="${user.photoURL}" alt="">`
    : initial;
  bar.innerHTML = `
    <div class="account-bar-avatar">${avatarHtml}</div>
    <div class="account-bar-email">${escapeHtml(user.email || '')}</div>
    <button class="account-bar-logout" id="logout-btn">로그아웃</button>
  `;
  document.getElementById('logout-btn').addEventListener('click', async () => {
    try{ await window.fb.signOutUser(); }catch(e){ console.error(e); }
  });
}

async function migrateLocalIfNeeded(){
  try{
    const cloudEntries = await window.fb.loadEntries(currentUser.uid);
    if(cloudEntries.length > 0) return;

    const raw = localStorage.getItem('word_post_office_postcards');
    if(!raw) return;
    let localItems;
    try{ localItems = JSON.parse(raw); }catch(e){ return; }
    if(!Array.isArray(localItems) || localItems.length === 0) return;

    const ok = confirm(`이 기기에 저장된 표현 ${localItems.length}개를 내 계정으로 가져올까요?`);
    if(!ok) return;

    for(const item of localItems){
      if(!item.id) item.id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
      await window.fb.saveEntry(currentUser.uid, item);
    }
  }catch(err){
    console.error('마이그레이션 실패', err);
  }
}

async function loadFromCloud(){
  try{
    history = await window.fb.loadEntries(currentUser.uid);
  }catch(err){
    console.error('클라우드 불러오기 실패', err);
    history = [];
  }

  try{
    const userDoc = await window.fb.loadUserDoc(currentUser.uid);
    if(userDoc && userDoc.geminiKey){
      apiKey = sanitizeKey(userDoc.geminiKey);
      const input = document.getElementById('api-key-input');
      const status = document.getElementById('key-status');
      input.value = apiKey;
      status.textContent = '키가 계정에 저장되어 있습니다.';
      updateKeyPanelVisibility();
    }else{
      loadApiKey();
    }
  }catch(err){
    console.error('사용자 설정 불러오기 실패', err);
    loadApiKey();
  }
}

function cloudSaveEntry(item){
  if(!currentUser) return;
  window.fb.saveEntry(currentUser.uid, item).catch(err => console.error('저장 실패', err));
}
function cloudUpdateEntry(id, patch){
  if(!currentUser) return;
  window.fb.updateEntry(currentUser.uid, id, patch).catch(err => console.error('업데이트 실패', err));
}
function cloudDeleteEntry(id){
  if(!currentUser) return;
  window.fb.deleteEntry(currentUser.uid, id).catch(err => console.error('삭제 실패', err));
}
function cloudSaveKey(val){
  if(!currentUser) return;
  window.fb.saveUserDoc(currentUser.uid, { geminiKey: val }).catch(err => console.error('키 저장 실패', err));
}

initAuthFlow();
</script>
